<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>متابعة المنشآت · البيئة الخضراء</title>
<script>
  // Staff tracker. Its API is api/crm/* in this project, reached through /crm/api/*
  // (see vercel.json). Preview addresses are sent to the live site.
  if (/\.vercel\.app$/.test(location.hostname)) location.replace("https://geckuw.com/crm/" + location.hash);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="app.css">
<link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png?v=3">
<link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png?v=3">
<meta name="theme-color" content="#1B5E20">
</head>
<body>
<div id="authRoot"></div>
<div id="appRoot" hidden>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="#home"><img src="/gec-logo.png" alt="البيئة الخضراء" width="58" height="40"><span><b>البيئة الخضراء</b><small>متابعة منشآت الدليل الصناعي</small></span></a>
      <nav class="tabs" aria-label="الأقسام">
        <a href="#home" id="navHome">القطاعات</a>
        <a href="#today" id="navToday">مواعيد اليوم <span class="badge num" id="dueBadge" hidden>0</span></a>
      </nav>
      <form class="search" id="gSearchForm" role="search"><input id="gSearch" type="search" placeholder="ابحث باسم المنشأة أو المنتج أو الهاتف…" autocomplete="off"></form>
      <div class="hdr-actions">
        <span class="conn" id="conn" data-s="wait"><i></i><span>جاري التحميل…</span></span>
        <button class="btn small" id="exportBtn" type="button">تصدير CSV</button>
        <div class="usermenu">
          <button class="btn small" id="userBtn" type="button" aria-haspopup="true" aria-expanded="false"><span id="userName"></span> ▾</button>
          <div class="menu" id="userMenu" hidden>
            <small id="userRole"></small>
            <a href="#users" id="menuUsers" hidden>المستخدمون</a>
            <a href="#account">تغيير كلمة المرور</a>
            <button type="button" id="logoutBtn">تسجيل الخروج</button>
          </div>
        </div>
      </div>
    </div>
  </header>
  <main class="wrap" id="view"><div class="loading">جاري تحميل دليل المنشآت…</div></main>
</div>
<div id="drawerRoot"></div>
<div id="toastRoot"></div>
<script type="module" src="app.js"></script>
</body>
</html>
