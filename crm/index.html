<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>تتبع منشآت الدليل الصناعي</title>
<script>
  // Staff tracker. Its API runs in the industrial-directory-tracker Vercel project and is
  // reached through /crm/api/* (see vercel.json). Preview addresses are sent to the live site.
  if (/\.vercel\.app$/.test(location.hostname)) location.replace("https://geckuw.com/crm/" + location.hash);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b6b56'/%3E%3Cpath d='M7 24V14l6 4v-4l6 4V9h6v15z' fill='%23fff'/%3E%3C/svg%3E">
</head>
<body>
<div id="authRoot"></div>
<div id="appRoot" hidden>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="#home"><b>تتبع منشآت الدليل الصناعي</b><small>GEC · الاستشارات البيئية — الكويت</small></a>
      <nav class="tabs" aria-label="الأقسام">
        <a href="#home" id="navHome">القطاعات</a>
        <a href="#today" id="navToday">مواعيد اليوم <span class="badge num" id="dueBadge" hidden>0</span></a>
      </nav>
      <form class="search" id="gSearchForm" role="search"><input id="gSearch" type="search" placeholder="ابحث باسم المنشأة أو المنتج أو الهاتف…" autocomplete="off"></form>
      <div class="hdr-actions">
        <span class="conn" id="conn" data-s="wait"><i></i><span>جاري التحميل…</span></span>
        <button class="btn small" id="exportBtn" type="button">تصدير CSV</button>
        <div class="usermenu">
          <button class="btn small" id="userBtn" type="button" aria-haspopup="true" aria-expanded="false"><span id="userName"></span> ▾</button>
          <div class="menu" id="userMenu" hidden>
            <small id="userRole"></small>
            <a href="#users" id="menuUsers" hidden>المستخدمون</a>
            <a href="#account">تغيير كلمة المرور</a>
            <button type="button" id="logoutBtn">تسجيل الخروج</button>
          </div>
        </div>
      </div>
    </div>
  </header>
  <main class="wrap" id="view"><div class="loading">جاري تحميل دليل المنشآت…</div></main>
</div>
<div id="drawerRoot"></div>
<div id="toastRoot"></div>
<script type="module" src="app.js"></script>
</body>
</html>
